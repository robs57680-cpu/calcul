<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Calcul mental chrono</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#16302b; --panel:#0f2521; --ink:#f4efe1; --muted:#9fbdb5;
  --go:#ffd166; --bad:#ef476f; --ok:#8fd694; --line:#2a4b44;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#16302b;--panel:#0f2521;--ink:#f4efe1;}}
:root[data-theme="dark"]{--bg:#16302b;--panel:#0f2521;--ink:#f4efe1;}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body,button,input,select,label{touch-action:manipulation}
button{-webkit-user-select:none;user-select:none}
html{scroll-padding-top:env(safe-area-inset-top,0)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 system-ui,-apple-system,Segoe UI,sans-serif;
  padding-top:env(safe-area-inset-top,0);padding-bottom:env(safe-area-inset-bottom,0);min-height:100%}
.num{font-family:'Space Grotesk',system-ui,sans-serif;font-variant-numeric:tabular-nums}
#app{max-width:520px;margin:0 auto;padding:18px 16px 40px}
h1{font:700 20px/1.2 'Space Grotesk',sans-serif;margin:6px 0 2px;letter-spacing:.2px}
.sub{color:var(--muted);font-size:13px;margin:0 0 16px}
nav{display:flex;gap:8px;margin-bottom:16px}
nav button{flex:1 1 22%;min-width:0;padding:9px 2px;border:1px solid var(--line);background:var(--panel);color:var(--ink);
  border-radius:12px;font:600 14px/1 system-ui,sans-serif;cursor:pointer}
nav button.on{background:var(--go);color:#16302b;border-color:var(--go)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:18px;margin-bottom:14px}
.hidden{display:none}
.scorebar{display:flex;justify-content:space-between;color:var(--muted);font-size:13px;margin-bottom:10px}
.scorebar b{color:var(--ink)}
.stage{text-align:center;padding:28px 10px 18px}
.eq{font:700 42px/1.1 'Space Grotesk',sans-serif;letter-spacing:.5px}
.timer{margin-top:10px;color:var(--muted);font-size:15px}
.timer b{color:var(--ink)}
.bar{height:8px;border-radius:5px;background:var(--line);margin:12px 0 18px;overflow:hidden}
.bar>i{display:block;height:100%;width:0%;background:var(--ok);transition:width .08s linear,background .15s}
.answerRow{display:flex;gap:10px}
.answerRow input{flex:1;font:600 22px/1 'Space Grotesk',sans-serif;padding:12px 14px;border-radius:12px;
  border:1px solid var(--line);background:var(--bg);color:var(--ink);width:100%}
.answerRow input:focus{outline:2px solid var(--go)}
.btn{padding:12px 18px;border:none;border-radius:12px;background:var(--go);color:#16302b;
  font:700 15px/1 system-ui,sans-serif;cursor:pointer}
.btn.sec{background:transparent;border:1px solid var(--line);color:var(--ink)}
.btn.wide{width:100%}
.feedback{margin-top:14px;font-size:15px;min-height:22px}
.feedback.ok{color:var(--ok)}
.feedback.bad{color:var(--bad)}
h2{font:700 16px/1.2 'Space Grotesk',sans-serif;margin:0 0 10px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.hint{color:var(--muted);font-size:13px;margin:0 0 12px}
.opchk{display:flex;align-items:center;gap:6px;background:var(--bg);border:1px solid var(--line);
  border-radius:10px;padding:8px 12px;font:600 15px 'Space Grotesk',sans-serif;cursor:pointer}
.opchk input{accent-color:var(--go)}
.rangeGrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.rangeGrid label{display:block;font-size:12px;color:var(--muted);margin-bottom:4px}
.rangeGrid input{width:100%;padding:9px 10px;border-radius:10px;border:1px solid var(--line);
  background:var(--bg);color:var(--ink);font:inherit}
.tier{display:grid;grid-template-columns:1fr 1fr auto;gap:8px;align-items:end;margin-bottom:8px}
.tier label{display:block;font-size:11px;color:var(--muted);margin-bottom:3px}
.tier input{width:100%;padding:9px 10px;border-radius:10px;border:1px solid var(--line);
  background:var(--bg);color:var(--ink);font:inherit}
.x{background:none;border:none;color:var(--bad);font-size:18px;cursor:pointer;padding:8px}
.cabinet{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tcard{background:var(--bg);border:1px solid var(--go);border-radius:14px;padding:12px 10px;text-align:center}
.tcard .ti{font-size:34px;line-height:1.1}
.tcard img{width:46px;height:46px}
.tcard b{display:block;font:700 12.5px/1.25 'Space Grotesk',sans-serif;margin:6px 0 2px}
.tcard span{display:block;font-size:11px;color:var(--muted);line-height:1.3}
.tcard.locked{border-color:var(--line);filter:grayscale(1);opacity:.4}
.tcard.selected{border-color:var(--ok);box-shadow:0 0 0 2px var(--ok) inset}
.tcard[data-avatar]{cursor:pointer}
.avatarThumb{width:44px;height:44px;border-radius:12px;border:1.5px solid var(--go);flex-shrink:0;background:var(--bg)}
.xpbar{height:22px;border-radius:11px;background:var(--line);overflow:hidden;position:relative;
  box-shadow:inset 0 2px 5px rgba(0,0,0,.3)}
.xpbar>i{display:block;height:100%;position:relative;overflow:hidden;transition:width .5s ease;
  background:linear-gradient(90deg,var(--go),#ffb703)}
.xpbar>i::before{content:'';position:absolute;inset:0;
  background:linear-gradient(180deg,rgba(255,255,255,.4),rgba(255,255,255,0) 55%)}
.xpbar>i::after{content:'';position:absolute;inset:0;
  background:repeating-linear-gradient(60deg,rgba(255,255,255,.16) 0 8px,rgba(255,255,255,0) 8px 16px);
  animation:flow 1.1s linear infinite}
@keyframes flow{from{background-position:0 0}to{background-position:22px 0}}
.sectionTitle{font:700 13px 'Space Grotesk',sans-serif;color:var(--muted);margin:16px 0 8px;text-transform:uppercase;letter-spacing:.04em}
.sectionTitle:first-child{margin-top:0}
.levelCard{padding:14px 16px}
.trophyRow{display:flex;flex-wrap:wrap;gap:8px}
.trophy{font-size:22px;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:6px 9px;cursor:default;line-height:1}
select{width:100%;padding:11px 10px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:inherit}
.numpad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.numpad button{padding:14px 0;font:700 20px 'Space Grotesk',sans-serif;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--ink);cursor:pointer}
.numpad button:active{background:var(--line)}
.banner{display:block;width:100%;text-align:left;margin:0 0 14px;padding:12px 14px;border-radius:14px;border:1px dashed var(--go);background:var(--panel);color:var(--ink);font:600 14px/1.3 system-ui,sans-serif;cursor:pointer}
.banner small{display:block;color:var(--muted);font-weight:400;font-size:12px;margin-top:2px}
.help{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin:-6px 0 14px;font-size:14px;line-height:1.55}
.help h3{font:700 14px 'Space Grotesk',sans-serif;margin:12px 0 4px;color:var(--go)}
.help h3:first-child{margin-top:0}
.help p,.help ul{margin:0 0 4px}
.help ul{padding-left:18px}
.info{font-size:13px;color:var(--muted);line-height:1.5;margin:10px 0 0}
</style>
</head>
<body>
<div id="app"></div>
<script>
const $=s=>document.querySelector(s);
const LS='calcmental-settings-v1';
const DEFAULTS={ops:{add:true,sub:true,mul:true,div:false},range:{min:2,max:20},mulRange:{min:2,max:10},
  tiers:[{max:3,points:5},{max:6,points:3},{max:10,points:1}]};
let S=null;
try{const raw=localStorage.getItem(LS);S=raw?JSON.parse(raw):null}catch(e){}
if(!S)S=JSON.parse(JSON.stringify(DEFAULTS));
S.ops=S.ops||DEFAULTS.ops;S.range=S.range||DEFAULTS.range;S.mulRange=S.mulRange||DEFAULTS.mulRange;
S.tiers=S.tiers&&S.tiers.length?S.tiers:JSON.parse(JSON.stringify(DEFAULTS.tiers));
S.bestScores=(S.bestScores&&S.bestScores.game&&S.bestScores.training)?S.bestScores:{game:{},training:{}};
S.perfect=S.perfect||{};S.totalXp=S.totalXp||0;S.avatar=S.avatar||null;S.selectedLevel=S.selectedLevel||1;
function saveS(){try{localStorage.setItem(LS,JSON.stringify(S))}catch(e){}}

let view='game',playState='setup',helpOpen=false;
let sessionLen=10,sessionQ=0,sessionScore=0,sessionCorrect=0,prevBest=0,lastWasRecord=false;
let lastLeveledUp=false,lastNewLevel=1,lastNewTrophies=[],lastXpGained=0,lastMaxScore=0,lastXpBlocked=false,lastPerfect=false,lastNewStar=false,lastNewMastery=false;
let question=null,startT=0,timerId=null,answered=false;

/* ---------- Niveaux XP & trophées ---------- */
const TROPHIES=[
  {level:2,icon:'🥉',name:'Premier calcul',desc:'Tu as passé le niveau 1 !'},
  {level:3,icon:'➕',name:'Additionneur en herbe',desc:'Niveau 3 atteint.'},
  {level:5,icon:'⚡',name:'Réflexes éclair',desc:'Niveau 5 atteint.'},
  {level:7,icon:'🎯',name:'Précision totale',desc:'Niveau 7 atteint.'},
  {level:10,icon:'🥈',name:'Calculateur confirmé',desc:'Niveau 10 atteint.'},
  {level:15,icon:'🔥',name:'Série en feu',desc:'Niveau 15 atteint.'},
  {level:20,icon:'🥇',name:'Champion du calcul mental',desc:'Niveau 20 atteint.'},
  {level:25,icon:'🧠',name:'Cerveau surdoué',desc:'Niveau 25 atteint.'},
  {level:30,icon:'💎',name:'Génie des chiffres',desc:'Niveau 30 atteint.'},
  {level:40,icon:'🚀',name:'Vitesse supersonique',desc:'Niveau 40 atteint.'},
  {level:50,icon:'👑',name:'Légende du calcul mental',desc:'Niveau 50 atteint.'}
];
function trophyForLevel(L){
  const t=TROPHIES.find(x=>x.level===L);if(t)return t;
  if(L>50&&L%10===0)return{level:L,icon:'🌟',name:'Sommet niveau '+L,desc:'Niveau '+L+' atteint.'};
  return null;
}
function allTrophiesUpTo(L){
  const list=TROPHIES.filter(t=>t.level<=L).slice();
  for(let l=60;l<=L;l+=10)list.push({level:l,icon:'🌟',name:'Sommet niveau '+l,desc:'Niveau '+l+' atteint.'});
  return list.sort((a,b)=>a.level-b.level);
}
// Niveau n -> n+1 : 50*(n+1) XP (100, 150, 200...). XP cumulé pour atteindre le niveau L :
function xpToNext(L){return 50*(L+1)}
function cumXp(L){return 50*(L*(L+1)/2-1)}
function levelForXp(xp){let L=1;while(cumXp(L+1)<=xp)L++;return L}
function levelHtml(showAvatar){
  const L=levelForXp(S.totalXp),base=cumXp(L),next=cumXp(L+1);
  const pct=Math.min(100,((S.totalXp-base)/(next-base))*100);
  const earned=allTrophiesUpTo(L);
  const avatarImg=showAvatar&&S.avatar&&AVATAR_IMG[S.avatar]?`<img class="avatarThumb" src="${AVATAR_IMG[S.avatar]}" alt="Avatar">`:'';
  return `<div class="card levelCard">
    <div class="row" style="justify-content:space-between;align-items:center;gap:10px">
      ${avatarImg}
      <div style="flex:1;min-width:0"><div class="row" style="justify-content:space-between">
        <b class="num" style="font-size:18px">Niveau ${L}</b><span class="hint">${S.totalXp} XP</span>
      </div></div>
    </div>
    <div class="xpbar" style="margin:10px 0 6px"><i style="width:${pct}%"></i></div>
    <p class="hint" style="margin:0 0 10px">${Math.max(0,next-S.totalXp)} XP avant le niveau ${L+1}</p>
    ${earned.length?`<div class="trophyRow">${earned.map(t=>`<span class="trophy" title="${t.name} — ${t.desc}">${t.icon}</span>`).join('')}</div>`
      :`<p class="hint" style="margin:0">Pas encore de trophée : continue à jouer !</p>`}
  </div>`;
}

/* ---------- Niveaux de difficulté du Jeu (1 à 20) ---------- */
function levelConfig(level){
  const L=Math.max(1,Math.min(20,level));
  const ops={add:true,sub:L>=3,mul:L>=6,div:L>=10};
  const range={min:Math.round((L-1)*1.5)+1,max:Math.round(10+(L-1)*4.5)};
  const mulRange=L>=6?{min:1+Math.floor((L-6)/3),max:Math.round(5+(L-6)*15/14)}:{min:1,max:10};
  const t1=+(5-(L-1)*(1.5/19)).toFixed(1);
  const tiers=[{max:t1,points:5},{max:+(t1*1.8).toFixed(1),points:3},{max:+(t1*3).toFixed(1),points:1}];
  return{ops,range,mulRange,tiers};
}
function levelXpPercent(L){return L*10}
// Score maximal d'une série = nombre de calculs x points du meilleur palier ; sous 50 % de ce max, pas d'XP.
function maxSessionScore(cfg,len){return len*Math.max(0,...cfg.tiers.map(t=>t.points))}
function opsSymbols(o){return[o.add?'+':'',o.sub?'−':'',o.mul?'×':'',o.div?'÷':''].filter(Boolean).join(' ')}
function describeLevel(L){
  const c=levelConfig(L);
  return opsSymbols(c.ops)+' · nombres '+c.range.min+'–'+c.range.max+((c.ops.mul||c.ops.div)?' · tables '+c.mulRange.min+'–'+c.mulRange.max:'');
}
const LENS=[5,10,15,20];
function starCount(L){return LENS.filter(n=>S.perfect[L+'_'+n]).length}
function totalStars(){return Array.from({length:20},(_,i)=>starCount(i+1)).reduce((a,b)=>a+b,0)}

function activeConfig(){
  return view==='game'?levelConfig(S.selectedLevel):{ops:S.ops,range:S.range,mulRange:S.mulRange,tiers:S.tiers};
}

/* ---------- Calculs ---------- */
function rand(a,b){return Math.floor(Math.random()*(b-a+1))+a}
function pointsForTime(tiers,t){
  const ts=tiers.slice().sort((a,b)=>a.max-b.max);
  for(const ti of ts){if(t<=ti.max)return ti.points}return 0;
}
function genQuestion(c){
  const enabled=Object.keys(c.ops).filter(k=>c.ops[k]);
  const op=enabled.length?enabled[rand(0,enabled.length-1)]:'add';
  let a,b,text,answer;
  if(op==='add'){a=rand(c.range.min,c.range.max);b=rand(c.range.min,c.range.max);text=a+' + '+b;answer=a+b}
  else if(op==='sub'){a=rand(c.range.min,c.range.max);b=rand(c.range.min,c.range.max);if(b>a){const t=a;a=b;b=t}text=a+' − '+b;answer=a-b}
  else if(op==='mul'){a=rand(c.mulRange.min,c.mulRange.max);b=rand(c.mulRange.min,c.mulRange.max);text=a+' × '+b;answer=a*b}
  else{b=Math.max(1,rand(c.mulRange.min,c.mulRange.max));a=rand(c.mulRange.min,c.mulRange.max);text=(a*b)+' ÷ '+b;answer=a}
  return{text,answer};
}

/* ---------- Série ---------- */
function bestStore(){return view==='game'?S.bestScores.game:S.bestScores.training}
function bestKey(len){return view==='game'?(S.selectedLevel+'_'+len):String(len)}
function startSession(len){
  sessionLen=Math.max(1,len);sessionQ=0;sessionScore=0;sessionCorrect=0;playState='running';nextQuestion();
}
function nextQuestion(){
  sessionQ++;const cfg=activeConfig();
  question=genQuestion(cfg);answered=false;startT=performance.now();
  renderPlay();
  const inp=$('#ans');if(inp){inp.value='';inp.focus()}
  clearInterval(timerId);
  const maxT=cfg.tiers.slice().sort((a,b)=>a.max-b.max).slice(-1)[0]?.max||5;
  timerId=setInterval(()=>{
    const el=$('#tval'),bar=$('#barfill');if(!el)return;
    const t=(performance.now()-startT)/1000;
    el.textContent=t.toFixed(1)+' s';
    if(bar){bar.style.width=Math.min(100,t/maxT*100)+'%';
      bar.style.background=pointsForTime(cfg.tiers,t)>0?(t<=maxT*0.5?'var(--ok)':'var(--go)'):'var(--bad)'}
  },100);
}
function submitAnswer(){
  if(answered)return;
  const inp=$('#ans');const val=inp.value.trim();if(val==='')return;
  clearInterval(timerId);
  const t=(performance.now()-startT)/1000;
  const correct=parseInt(val,10)===question.answer;
  const pts=correct?pointsForTime(activeConfig().tiers,t):0;
  answered=true;sessionScore+=pts;if(correct)sessionCorrect++;
  const fb=$('#fb');
  if(correct){fb.className='feedback ok';fb.textContent='✅ Correct ! +'+pts+' point'+(pts>1?'s':'')+' ('+t.toFixed(1)+' s)'}
  else{fb.className='feedback bad';fb.textContent='❌ Raté — la réponse était '+question.answer+' (0 point)'}
  $('#score').textContent=sessionScore;$('#count').textContent=sessionQ+'/'+sessionLen;
  setTimeout(()=>{sessionQ>=sessionLen?finishSession():nextQuestion()},correct?900:1500);
}
function finishSession(){
  clearInterval(timerId);
  const store=bestStore(),key=bestKey(sessionLen);
  prevBest=store[key]||0;lastWasRecord=sessionScore>prevBest;
  if(lastWasRecord)store[key]=sessionScore;
  lastLeveledUp=false;lastNewTrophies=[];lastXpGained=0;lastXpBlocked=false;lastPerfect=false;lastNewStar=false;lastNewMastery=false;lastNewLevel=levelForXp(S.totalXp);lastMaxScore=maxSessionScore(activeConfig(),sessionLen);
  if(view==='game'){
    lastPerfect=lastMaxScore>0&&sessionScore===lastMaxScore;
    const pk=S.selectedLevel+'_'+sessionLen;
    if(lastPerfect){
      lastNewStar=!S.perfect[pk];
      const wasMastered=levelMastered(S.selectedLevel);
      S.perfect[pk]=true;
      lastNewMastery=!wasMastered&&levelMastered(S.selectedLevel);
    }
    lastXpBlocked=sessionScore*2<lastMaxScore;
    lastXpGained=lastXpBlocked?0:Math.round(sessionScore*levelXpPercent(S.selectedLevel)/100);
    const oldL=levelForXp(S.totalXp);
    S.totalXp+=lastXpGained;
    const newL=levelForXp(S.totalXp);
    lastLeveledUp=newL>oldL;lastNewLevel=newL;
    for(let L=oldL+1;L<=newL;L++){const t=trophyForLevel(L);if(t)lastNewTrophies.push(t)}
  }
  saveS();playState='done';renderPlay();
}

/* ---------- Écrans ---------- */
function navHtml(){
  const b=(v,l)=>`<button class="${view===v?'on':''}" data-v="${v}">${l}</button>`;
  const nav=`<nav>${b('game','Jeu')}${b('training','Entraînement')}${b('trophies','Trophées')}${b('settings','Réglages')}</nav>`;
  if(playState==='running'&&view!=='settings')return nav;
  return nav+helpHtml();
}
function helpHtml(){
  const banner=`<button class="banner" id="helpBanner">💡 Comment ça marche ?<small>${helpOpen?'Touche pour refermer les explications':'Touche pour voir les explications du jeu'}</small></button>`;
  if(!helpOpen)return banner;
  return banner+`<div class="help">
    <h3>Le principe</h3>
    <p>Un calcul apparaît et le chrono démarre aussitôt. Tape ta réponse (pavé à l'écran ou clavier) puis valide : plus tu es rapide, plus tu marques de points. Une mauvaise réponse rapporte 0 point.</p>
    <h3>Les points d'une réponse</h3>
    <p>Chaque niveau a ses paliers de temps (ex. moins de 3 s → 5 points, moins de 6 s → 3 points…). Plus le niveau est haut, plus ces paliers sont serrés.</p>
    <h3>Onglet Jeu</h3>
    <ul><li>20 niveaux de difficulté : plus d'opérations (− au niveau 3, × au 6, ÷ au 10), des nombres plus grands, des temps plus courts.</li>
    <li>Le score de la série est converti en XP selon le niveau choisi : 10 % au niveau 1, 20 % au niveau 2… jusqu'à 200 % au niveau 20.</li>
    <li>⭐ Une étoile récompense une série parfaite (tous les points, à chaque calcul). Objectif : une étoile pour chaque niveau et chaque longueur de série (5, 10, 15, 20 calculs).</li>
    <li>Pour éviter de « farmer », l'XP n'est gagnée que si ton score atteint au moins 50 % des points maximum de la série (nombre de calculs × points du palier le plus rapide).</li></ul>
    <h3>Onglet Entraînement</h3>
    <p>Tu choisis librement les opérations, les nombres et les paliers dans l'onglet Réglages. Idéal pour réviser une table précise, mais il ne rapporte aucune XP.</p>
    <h3>Ton niveau de maîtrise</h3>
    <p>Il faut 100 XP pour passer du niveau 1 au niveau 2, puis 50 XP de plus à chaque niveau (150, 200, 250…). Des trophées 🏆 se débloquent à certains niveaux et restent affichés en permanence.</p>
    <h3>Les séries et les records</h3>
    <p>Choisis le nombre de calculs d'une série, puis essaie de battre ton record sur ce même nombre. Chaque niveau du jeu a ses propres records.</p>
  </div>`;
}
function bindNav(){
  const hb=$('#helpBanner');if(hb)hb.onclick=()=>{helpOpen=!helpOpen;render()};
  document.querySelectorAll('nav [data-v]').forEach(b=>b.onclick=()=>{
    if(playState==='running'){clearInterval(timerId);playState='setup'}
    if(playState==='done')playState='setup';
    view=b.dataset.v;render();
  });
}
function render(){view==='settings'?renderSettings():view==='trophies'?renderTrophies():renderPlay()}
function renderTrophies(){
  const el=$('#app');
  const XL=levelForXp(S.totalXp);
  const xpAll=TROPHIES.slice();
  for(let l=60;l<=XL;l+=10)xpAll.push(trophyForLevel(l));
  if(XL>=50 && !xpAll.find(t=>t.level>XL)) xpAll.push(trophyForLevel(Math.floor(XL/10)*10+10));
  const xpGot=xpAll.filter(t=>t.level<=XL).length;
  const masteryGot=Array.from({length:20},(_,i)=>i+1).filter(levelMastered).length;
  el.innerHTML=`<h1>Calcul mental chrono</h1>
    <p class="sub">Ton armoire à trophées.</p>
    ${navHtml()}${levelHtml(view==='game')}
    <div class="card">
      <h2>🏆 Armoire à trophées</h2>
      <p class="hint">Trophées de niveau : <b class="num">${xpGot}/${xpAll.length}</b> · Trophées de maîtrise : <b class="num">${masteryGot}/20</b></p>
      <p class="sectionTitle">Trophées de niveau (XP)</p>
      <div class="cabinet">${xpAll.map(t=>{const ok=t.level<=XL;
        return `<div class="tcard ${ok?'':'locked'}"><div class="ti">${t.icon}</div><b>${t.name}</b><span>${ok?t.desc:'Niveau '+t.level+' requis'}</span></div>`}).join('')}</div>
      <p class="sectionTitle">Trophées de maîtrise (niveaux de difficulté)</p>
      <p class="hint" style="margin-top:-4px">Débloqués en obtenant les 4 étoiles d'un niveau de difficulté (séries de 5, 10, 15 et 20 calculs réussies à 100 %).</p>
      <div class="cabinet">${Array.from({length:20},(_,i)=>i+1).map(L=>{const ok=levelMastered(L);
        return `<div class="tcard ${ok?'':'locked'}"><img src="${MASTERY_IMG[L]}" alt=""><b>${MASTERY_NAMES[L-1]}</b><span>${ok?'Niveau '+L+' maîtrisé !':'Niveau '+L+' : 4 étoiles requises ('+starCount(L)+'/4)'}</span></div>`}).join('')}</div>
      <p class="sectionTitle">Avatars</p>
      <p class="hint" style="margin-top:-4px">Un nouvel avatar se débloque tous les 2 niveaux. Touche un avatar débloqué pour le choisir — il s'affichera à côté de ta barre d'XP sur la page Jeu.</p>
      <div class="cabinet">${AVATAR_LEVELS.map(lv=>{const ok=XL>=lv,sel=S.avatar===lv;
        return `<div class="tcard ${ok?'':'locked'} ${sel?'selected':''}" ${ok?'data-avatar="'+lv+'"':''}><img src="${AVATAR_IMG[lv]}" alt=""><b>Niveau ${lv}</b><span>${sel?'✓ Choisi':(ok?'Toucher pour choisir':'Niveau '+lv+' requis')}</span></div>`}).join('')}</div>
    </div>`;
  bindNav();
  el.querySelectorAll('[data-avatar]').forEach(c=>c.onclick=()=>{S.avatar=+c.dataset.avatar;saveS();renderTrophies()});
}
function renderPlay(){
  if(playState==='running')return renderRunning();
  if(playState==='done')return renderDone();
  return renderSetup();
}
function lenPickerHtml(){
  return `<h2>Nombre de calculs dans la série</h2>
    <div class="row">${LENS.map(n=>`<button class="btn ${n===sessionLen?'':'sec'}" data-len="${n}">${n}${view==='game'&&S.perfect[S.selectedLevel+'_'+n]?' ⭐':''}</button>`).join('')}</div>
    <div class="rangeGrid" style="margin-top:12px;max-width:170px">
      <div><label>Autre nombre${view==='game'&&!LENS.includes(sessionLen)&&S.perfect[S.selectedLevel+'_'+sessionLen]?' ⭐':''}</label><input type="number" id="lenCustom" min="1" value="${sessionLen}"></div></div>`;
}
function bindLenPicker(){
  document.querySelectorAll('[data-len]').forEach(b=>b.onclick=()=>{sessionLen=+b.dataset.len;renderSetup()});
  $('#lenCustom').onchange=e=>{const v=parseInt(e.target.value,10);if(v>0){sessionLen=v;renderSetup()}};
  $('#startBtn').onclick=()=>startSession(sessionLen);
}
function renderSetup(){
  const el=$('#app');const best=bestStore()[bestKey(sessionLen)];
  const bestTxt=best!=null?'Ton meilleur score sur '+sessionLen+' calculs : <b class="num">'+best+'</b> points.':'Pas encore de score enregistré sur '+sessionLen+' calculs.';
  let body;
  if(view==='game'){
    const L=S.selectedLevel,c=levelConfig(L);
    const opts=Array.from({length:20},(_,i)=>i+1).map(n=>{const sc=starCount(n);return `<option value="${n}" ${n===L?'selected':''}>Niveau ${n} — ${describeLevel(n)} — ${levelXpPercent(n)}% XP${sc?' — ⭐ '+sc+'/4':''}</option>`}).join('');
    body=`<div class="card"><h2>Niveau de difficulté</h2>
      <select id="levelSel">${opts}</select>
      <p class="info"><b>Niveau ${L}</b> : ${describeLevel(L)}<br>
      Paliers : ${c.tiers.map(t=>'moins de '+t.max+' s → '+t.points+' pt'+(t.points>1?'s':'')).join(' · ')}<br>
      Étoiles de ce niveau : <b>${starCount(L)}/4</b> (séries parfaites de 5, 10, 15 et 20 calculs) · total : <b>${totalStars()}/80</b> ⭐<br>
      Rapporte <b>${levelXpPercent(L)}%</b> du score en XP, à condition d\u2019atteindre au moins 50 % des points maximum de la série.</p></div>
      <div class="card">${lenPickerHtml()}
      <p class="hint" style="margin-top:12px">${bestTxt}</p>
      <button class="btn wide" id="startBtn">Commencer</button></div>`;
  }else{
    body=`<div class="card">${lenPickerHtml()}
      <p class="hint" style="margin-top:12px">${bestTxt}</p>
      <p class="hint">Entraînement libre (réglages de l'onglet Réglages) : aucune XP gagnée.</p>
      <button class="btn wide" id="startBtn">Commencer</button></div>`;
  }
  el.innerHTML=`<h1>Calcul mental chrono</h1>
    <p class="sub">${view==='game'?'Choisis ton niveau : plus il est haut, plus il rapporte d\u2019XP.':'Entraîne-toi sur les calculs de ton choix.'}</p>
    ${navHtml()}${levelHtml(view==='game')}${body}`;
  bindNav();bindLenPicker();
  if(view==='game')$('#levelSel').onchange=e=>{S.selectedLevel=+e.target.value;saveS();renderSetup()};
}
function renderRunning(){
  const el=$('#app');
  el.innerHTML=`<h1>Calcul mental chrono</h1>
    <p class="sub">${view==='game'?'Jeu · niveau '+S.selectedLevel:'Entraînement libre'}</p>
    ${navHtml()}
    <div class="card">
      <div class="scorebar"><span>Question : <b id="count">${sessionQ}/${sessionLen}</b></span><span>Score : <b id="score">${sessionScore}</b></span></div>
      <div class="stage"><div class="eq num">${question?question.text+' = ?':'—'}</div>
        <div class="timer">Temps : <b id="tval" class="num">0.0 s</b></div></div>
      <div class="bar"><i id="barfill"></i></div>
      <div class="answerRow">
        <input id="ans" type="text" inputmode="none" autocomplete="off" placeholder="Ta réponse" autofocus>
        <button class="btn" id="valider">Valider</button>
      </div>
      <div class="numpad" id="numpad">
        ${['1','2','3','4','5','6','7','8','9'].map(d=>`<button data-d="${d}">${d}</button>`).join('')}
        <button data-d="C">C</button><button data-d="0">0</button><button data-d="back">⌫</button>
      </div>
      <div class="feedback" id="fb"></div>
    </div>
    <button class="btn sec wide" id="stop">Arrêter la série</button>
    ${levelHtml(view==='game')}`;
  const inp=$('#ans');
  $('#valider').onclick=submitAnswer;
  inp.addEventListener('keydown',e=>{if(e.key==='Enter')submitAnswer()});
  inp.addEventListener('input',()=>{inp.value=inp.value.replace(/[^0-9]/g,'')});
  document.querySelectorAll('#numpad button').forEach(b=>b.onclick=()=>{
    const d=b.dataset.d;
    if(d==='C')inp.value='';else if(d==='back')inp.value=inp.value.slice(0,-1);else inp.value+=d;
    inp.focus();
  });
  $('#stop').onclick=()=>{clearInterval(timerId);playState='setup';renderPlay()};
  bindNav();
}
function renderDone(){
  const el=$('#app');const bestNow=Math.max(prevBest,sessionScore);
  el.innerHTML=`<h1>Calcul mental chrono</h1>${navHtml()}
    <div class="card" style="text-align:center">
      <h2>Série terminée !</h2>
      <div class="eq num" style="font-size:36px">${sessionScore} pts</div>
      <p class="hint">${sessionCorrect}/${sessionLen} bonnes réponses</p>
      ${view==='game'?(lastXpBlocked?`<p class="feedback bad" style="font-size:15px">Pas d'XP : ton score (${sessionScore}) est sous 50 % du maximum (${lastMaxScore}). Vise au moins ${Math.ceil(lastMaxScore/2)} points !</p>`
        :`<p class="feedback ok" style="font-size:16px">+${lastXpGained} XP (niveau ${S.selectedLevel} : ${levelXpPercent(S.selectedLevel)}%)</p>`)
        :`<p class="hint">Entraînement : aucune XP gagnée.</p>`}
      ${lastPerfect?`<p class="feedback ok" style="font-size:16px">⭐ Série parfaite !${lastNewStar?' Nouvelle étoile pour le niveau '+S.selectedLevel+' ('+starCount(S.selectedLevel)+'/4).':''}</p>`:''}
      ${lastNewMastery?`<p class="feedback ok" style="font-size:16px">🏆 Trophée de maîtrise débloqué : ${MASTERY_NAMES[S.selectedLevel-1]} (niveau ${S.selectedLevel}) !</p>`:''}
      ${lastWasRecord?`<p class="feedback ok" style="font-size:16px">🎉 Nouveau record ! (ancien : ${prevBest})</p>`
        :`<p class="hint">Ton record : <b class="num">${bestNow}</b> points.</p>`}
      ${lastLeveledUp?`<p class="feedback ok" style="font-size:16px">⬆️ Niveau ${lastNewLevel} atteint !</p>`:''}
      ${lastNewTrophies.map(t=>`<p class="feedback ok" style="font-size:15px">🏆 Trophée débloqué : ${t.icon} ${t.name} — ${t.desc}</p>`).join('')}
      <div class="row" style="margin-top:14px;justify-content:center">
        <button class="btn" id="again">Rejouer (${sessionLen})</button>
        <button class="btn sec" id="changeLen">Changer</button>
      </div>
    </div>${levelHtml(view==='game')}`;
  $('#again').onclick=()=>startSession(sessionLen);
  $('#changeLen').onclick=()=>{playState='setup';renderPlay()};
  bindNav();
}
function tierRow(t,i){
  return `<div class="tier">
    <div><label>Sous (secondes)</label><input type="number" min="0.5" step="0.5" value="${t.max}" data-i="${i}" data-f="max"></div>
    <div><label>Points</label><input type="number" min="0" step="1" value="${t.points}" data-i="${i}" data-f="points"></div>
    <button class="x" data-del="${i}" title="Retirer">✕</button></div>`;
}
function renderSettings(){
  const el=$('#app');const ts=S.tiers.slice().sort((a,b)=>a.max-b.max);
  el.innerHTML=`<h1>Calcul mental chrono</h1>
    <p class="sub">Réglages de l'onglet Entraînement (aucune XP n'est gagnée avec ces réglages).</p>
    ${navHtml()}${levelHtml(view==='game')}
    <div class="card"><h2>Opérations</h2><div class="row">
      ${[['add','+'],['sub','−'],['mul','×'],['div','÷']].map(([k,s])=>`<label class="opchk"><input type="checkbox" data-op="${k}" ${S.ops[k]?'checked':''}>${s}</label>`).join('')}
    </div></div>
    <div class="card"><h2>Nombres pour + et −</h2><div class="rangeGrid">
      <div><label>Minimum</label><input type="number" id="rmin" value="${S.range.min}"></div>
      <div><label>Maximum</label><input type="number" id="rmax" value="${S.range.max}"></div></div></div>
    <div class="card"><h2>Nombres pour × et ÷</h2><div class="rangeGrid">
      <div><label>Minimum</label><input type="number" id="mmin" value="${S.mulRange.min}"></div>
      <div><label>Maximum</label><input type="number" id="mmax" value="${S.mulRange.max}"></div></div></div>
    <div class="card"><h2>Paliers de points selon le temps</h2>
      <p class="hint">Réponse en moins de X secondes → Y points. Au-delà du plus grand palier : 0 point.</p>
      <div id="tiers">${ts.map(tierRow).join('')}</div>
      <button class="btn sec" id="addTier">＋ Ajouter un palier</button></div>`;
  bindNav();
  el.querySelectorAll('[data-op]').forEach(cb=>cb.onchange=()=>{S.ops[cb.dataset.op]=cb.checked;saveS()});
  const num=(id,o,k)=>{$(id).onchange=e=>{o[k]=parseInt(e.target.value,10)||0;saveS()}};
  num('#rmin',S.range,'min');num('#rmax',S.range,'max');num('#mmin',S.mulRange,'min');num('#mmax',S.mulRange,'max');
  el.querySelectorAll('#tiers input').forEach(inp=>inp.onchange=()=>{
    ts[+inp.dataset.i][inp.dataset.f]=parseFloat(inp.value)||0;S.tiers=ts;saveS();renderSettings();
  });
  el.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{ts.splice(+b.dataset.del,1);S.tiers=ts;saveS();renderSettings()});
  $('#addTier').onclick=()=>{
    const last=ts.length?ts[ts.length-1]:{max:2,points:1};
    ts.push({max:last.max+2,points:Math.max(0,last.points-1)});S.tiers=ts;saveS();renderSettings();
  };
}
render();
(function(){
  let lastTouch=0;
  document.addEventListener('touchend',e=>{
    const now=Date.now();
    if(now-lastTouch<=350){e.preventDefault()}
    lastTouch=now;
  },{passive:false});
})();
if('serviceWorker' in navigator && /^https?:/.test(location.protocol)){
  navigator.serviceWorker.register('sw.js').catch(()=>{});
}
</script>
</body>
</html>
