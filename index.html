<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Calcul mental chrono</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#16302b; --panel:#0f2521; --ink:#f4efe1; --muted:#9fbdb5;
  --go:#ffd166; --bad:#ef476f; --ok:#8fd694; --line:#2a4b44;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#16302b;--panel:#0f2521;--ink:#f4efe1;}}
:root[data-theme="dark"]{--bg:#16302b;--panel:#0f2521;--ink:#f4efe1;}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 system-ui,-apple-system,Segoe UI,sans-serif;
  padding-top:env(safe-area-inset-top,0);padding-bottom:env(safe-area-inset-bottom,0);min-height:100%}
.num{font-family:'Space Grotesk',system-ui,sans-serif;font-variant-numeric:tabular-nums}
#app{max-width:520px;margin:0 auto;padding:18px 16px 40px}
h1{font:700 20px/1.2 'Space Grotesk',sans-serif;margin:6px 0 2px;letter-spacing:.2px}
.sub{color:var(--muted);font-size:13px;margin:0 0 16px}
nav{display:flex;gap:8px;margin-bottom:16px}
nav button{flex:1;padding:10px;border:1px solid var(--line);background:var(--panel);color:var(--ink);
  border-radius:12px;font:600 14px/1 system-ui,sans-serif;cursor:pointer}
nav button.on{background:var(--go);color:#16302b;border-color:var(--go)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:18px;margin-bottom:14px}
.hidden{display:none}
.scorebar{display:flex;justify-content:space-between;color:var(--muted);font-size:13px;margin-bottom:10px}
.scorebar b{color:var(--ink)}
.stage{text-align:center;padding:28px 10px 18px}
.eq{font:700 42px/1.1 'Space Grotesk',sans-serif;letter-spacing:.5px}
.timer{margin-top:10px;color:var(--muted);font-size:15px}
.timer b{color:var(--ink)}
.bar{height:8px;border-radius:5px;background:var(--line);margin:12px 0 18px;overflow:hidden}
.bar>i{display:block;height:100%;width:0%;background:var(--ok);transition:width .08s linear,background .15s}
.answerRow{display:flex;gap:10px}
.answerRow input{flex:1;font:600 22px/1 'Space Grotesk',sans-serif;padding:12px 14px;border-radius:12px;
  border:1px solid var(--line);background:var(--bg);color:var(--ink);width:100%}
.answerRow input:focus{outline:2px solid var(--go)}
.btn{padding:12px 18px;border:none;border-radius:12px;background:var(--go);color:#16302b;
  font:700 15px/1 system-ui,sans-serif;cursor:pointer}
.btn.sec{background:transparent;border:1px solid var(--line);color:var(--ink)}
.btn.wide{width:100%}
.feedback{margin-top:14px;font-size:15px;min-height:22px}
.feedback.ok{color:var(--ok)}
.feedback.bad{color:var(--bad)}
h2{font:700 16px/1.2 'Space Grotesk',sans-serif;margin:0 0 10px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.hint{color:var(--muted);font-size:13px;margin:0 0 12px}
.opchk{display:flex;align-items:center;gap:6px;background:var(--bg);border:1px solid var(--line);
  border-radius:10px;padding:8px 12px;font:600 15px 'Space Grotesk',sans-serif;cursor:pointer}
.opchk input{accent-color:var(--go)}
.rangeGrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.rangeGrid label{display:block;font-size:12px;color:var(--muted);margin-bottom:4px}
.rangeGrid input{width:100%;padding:9px 10px;border-radius:10px;border:1px solid var(--line);
  background:var(--bg);color:var(--ink);font:inherit}
.tier{display:grid;grid-template-columns:1fr 1fr auto;gap:8px;align-items:end;margin-bottom:8px}
.tier label{display:block;font-size:11px;color:var(--muted);margin-bottom:3px}
.tier input{width:100%;padding:9px 10px;border-radius:10px;border:1px solid var(--line);
  background:var(--bg);color:var(--ink);font:inherit}
.x{background:none;border:none;color:var(--bad);font-size:18px;cursor:pointer;padding:8px}
</style>
</head>
<body>
<div id="app"></div>
<script>
const $=s=>document.querySelector(s);
const LS='calcmental-settings-v1';
const DEFAULTS={ops:{add:true,sub:true,mul:true,div:false},range:{min:2,max:20},mulRange:{min:2,max:10},
  tiers:[{max:3,points:5},{max:6,points:3},{max:10,points:1}]};
let S=null;
try{const raw=localStorage.getItem(LS);S=raw?JSON.parse(raw):null}catch(e){}
if(!S)S=JSON.parse(JSON.stringify(DEFAULTS));
S.ops=S.ops||DEFAULTS.ops;S.range=S.range||DEFAULTS.range;S.mulRange=S.mulRange||DEFAULTS.mulRange;
S.tiers=S.tiers&&S.tiers.length?S.tiers:JSON.parse(JSON.stringify(DEFAULTS.tiers));
S.bestScores=S.bestScores||{};
function saveS(){try{localStorage.setItem(LS,JSON.stringify(S))}catch(e){}}

let view='play',playState='setup';
let sessionLen=10,sessionQ=0,sessionScore=0,sessionCorrect=0,prevBest=0,lastWasRecord=false;
let question=null,startT=0,timerId=null,answered=false;

function rand(a,b){return Math.floor(Math.random()*(b-a+1))+a}
function sortedTiers(){return S.tiers.slice().sort((a,b)=>a.max-b.max)}
function pointsForTime(t){const ts=sortedTiers();for(const ti of ts){if(t<=ti.max)return ti.points}return 0}

function genQuestion(){
  const enabled=Object.keys(S.ops).filter(k=>S.ops[k]);
  const op=enabled.length?enabled[rand(0,enabled.length-1)]:'add';
  let a,b,text,answer;
  if(op==='add'){a=rand(S.range.min,S.range.max);b=rand(S.range.min,S.range.max);text=a+' + '+b;answer=a+b}
  else if(op==='sub'){a=rand(S.range.min,S.range.max);b=rand(S.range.min,S.range.max);if(b>a){const t=a;a=b;b=t}text=a+' − '+b;answer=a-b}
  else if(op==='mul'){a=rand(S.mulRange.min,S.mulRange.max);b=rand(S.mulRange.min,S.mulRange.max);text=a+' × '+b;answer=a*b}
  else{b=Math.max(1,rand(S.mulRange.min,S.mulRange.max));a=rand(S.mulRange.min,S.mulRange.max);text=(a*b)+' ÷ '+b;answer=a}
  return {text,answer};
}

function startSession(len){
  sessionLen=Math.max(1,len);sessionQ=0;sessionScore=0;sessionCorrect=0;playState='running';
  nextQuestion();
}
function nextQuestion(){
  sessionQ++;
  question=genQuestion();answered=false;startT=performance.now();
  renderPlay();
  const inp=$('#ans');if(inp){inp.value='';inp.focus()}
  clearInterval(timerId);
  timerId=setInterval(()=>{
    const el=$('#tval');const bar=$('#barfill');
    if(!el)return;
    const t=(performance.now()-startT)/1000;
    el.textContent=t.toFixed(1)+' s';
    const maxT=sortedTiers().slice(-1)[0]?.max||5;
    const pct=Math.min(100,(t/maxT)*100);
    if(bar){bar.style.width=pct+'%';bar.style.background=pointsForTime(t)>0?(t<=maxT*0.5?'var(--ok)':'var(--go)'):'var(--bad)'}
  },100);
}
function submitAnswer(){
  if(answered)return;
  const inp=$('#ans');const val=inp.value.trim();
  if(val==='')return;
  clearInterval(timerId);
  const t=(performance.now()-startT)/1000;
  const correct=parseInt(val,10)===question.answer;
  const pts=correct?pointsForTime(t):0;
  answered=true;sessionScore+=pts;if(correct)sessionCorrect++;
  const fb=$('#fb');
  if(correct){fb.className='feedback ok';fb.textContent='✅ Correct ! +'+pts+' point'+(pts>1?'s':'')+' ('+t.toFixed(1)+' s)'}
  else{fb.className='feedback bad';fb.textContent='❌ Raté — la réponse était '+question.answer+' (0 point)'}
  $('#score').textContent=sessionScore;$('#count').textContent=sessionQ+'/'+sessionLen;
  setTimeout(()=>{ sessionQ>=sessionLen?finishSession():nextQuestion() },correct?900:1500);
}
function finishSession(){
  clearInterval(timerId);
  prevBest=S.bestScores[sessionLen]||0;
  lastWasRecord=sessionScore>prevBest;
  if(lastWasRecord){S.bestScores[sessionLen]=sessionScore;saveS()}
  playState='done';
  renderPlay();
}

function renderPlay(){
  if(playState==='setup')return renderSetup();
  if(playState==='done')return renderDone();
  return renderRunning();
}
function renderSetup(){
  const el=$('#app');
  const choices=[5,10,15,20];
  const best=S.bestScores[sessionLen];
  el.innerHTML=`
    <h1>Calcul mental chrono</h1>
    <p class="sub">Choisis le nombre de calculs de la série, puis essaie de battre ton score la prochaine fois.</p>
    ${navHtml()}
    <div class="card">
      <h2>Nombre de calculs dans la série</h2>
      <div class="row">
        ${choices.map(n=>`<button class="btn ${n===sessionLen?'':'sec'}" data-len="${n}">${n}</button>`).join('')}
      </div>
      <div class="rangeGrid" style="margin-top:12px;max-width:170px">
        <div><label>Autre nombre</label><input type="number" id="lenCustom" min="1" value="${sessionLen}"></div>
      </div>
      <p class="hint" style="margin-top:12px">${best!=null?'Ton meilleur score sur '+sessionLen+' calculs : <b class="num">'+best+'</b> points.':'Pas encore de score enregistré sur '+sessionLen+' calculs.'}</p>
      <button class="btn wide" id="startBtn">Commencer</button>
    </div>
  `;
  el.querySelectorAll('[data-len]').forEach(b=>b.onclick=()=>{sessionLen=+b.dataset.len;renderSetup()});
  $('#lenCustom').onchange=e=>{const v=parseInt(e.target.value,10);if(v>0){sessionLen=v;renderSetup()}};
  $('#startBtn').onclick=()=>startSession(sessionLen);
  bindNav();
}
function renderRunning(){
  const el=$('#app');
  el.innerHTML=`
    <h1>Calcul mental chrono</h1>
    <p class="sub">Réponds le plus vite possible. Plus tu es rapide, plus tu marques de points.</p>
    ${navHtml()}
    <div class="card">
      <div class="scorebar"><span>Question : <b id="count">${sessionQ}/${sessionLen}</b></span><span>Score : <b id="score">${sessionScore}</b></span></div>
      <div class="stage">
        <div class="eq num">${question?question.text+' = ?':'—'}</div>
        <div class="timer">Temps : <b id="tval" class="num">0.0 s</b></div>
      </div>
      <div class="bar"><i id="barfill"></i></div>
      <div class="answerRow">
        <input id="ans" type="number" inputmode="numeric" placeholder="Ta réponse" autofocus>
        <button class="btn" id="valider">Valider</button>
      </div>
      <div class="feedback" id="fb"></div>
    </div>
    <button class="btn sec wide" id="stop">Arrêter la série</button>
  `;
  $('#valider').onclick=submitAnswer;
  $('#ans').addEventListener('keydown',e=>{if(e.key==='Enter')submitAnswer()});
  $('#stop').onclick=()=>{clearInterval(timerId);playState='setup';renderPlay()};
  bindNav();
}
function renderDone(){
  const el=$('#app');
  const bestNow=Math.max(prevBest,sessionScore);
  el.innerHTML=`
    <h1>Calcul mental chrono</h1>
    ${navHtml()}
    <div class="card" style="text-align:center">
      <h2>Série terminée !</h2>
      <div class="eq num" style="font-size:36px">${sessionScore} pts</div>
      <p class="hint">${sessionCorrect}/${sessionLen} bonnes réponses</p>
      ${lastWasRecord
        ?`<p class="feedback ok" style="font-size:16px">🎉 Nouveau record pour ${sessionLen} calculs ! (ancien record : ${prevBest})</p>`
        :`<p class="hint">Ton record sur ${sessionLen} calculs : <b class="num">${bestNow}</b> points.</p>`}
      <div class="row" style="margin-top:14px;justify-content:center">
        <button class="btn" id="again">Rejouer (${sessionLen})</button>
        <button class="btn sec" id="changeLen">Changer le nombre</button>
      </div>
    </div>
  `;
  $('#again').onclick=()=>startSession(sessionLen);
  $('#changeLen').onclick=()=>{playState='setup';renderPlay()};
  bindNav();
}

function tierRow(t,i){
  return `<div class="tier">
    <div><label>Sous (secondes)</label><input type="number" min="0.5" step="0.5" value="${t.max}" data-i="${i}" data-f="max"></div>
    <div><label>Points</label><input type="number" min="0" step="1" value="${t.points}" data-i="${i}" data-f="points"></div>
    <button class="x" data-del="${i}" title="Retirer">✕</button>
  </div>`;
}
function renderSettings(){
  const el=$('#app');
  const ts=sortedTiers();
  el.innerHTML=`
    <h1>Calcul mental chrono</h1>
    <p class="sub">Réglages du jeu.</p>
    ${navHtml()}
    <div class="card">
      <h2>Opérations</h2>
      <div class="row">
        <label class="opchk"><input type="checkbox" data-op="add" ${S.ops.add?'checked':''}>+</label>
        <label class="opchk"><input type="checkbox" data-op="sub" ${S.ops.sub?'checked':''}>−</label>
        <label class="opchk"><input type="checkbox" data-op="mul" ${S.ops.mul?'checked':''}>×</label>
        <label class="opchk"><input type="checkbox" data-op="div" ${S.ops.div?'checked':''}>÷</label>
      </div>
    </div>
    <div class="card">
      <h2>Nombres pour + et −</h2>
      <div class="rangeGrid">
        <div><label>Minimum</label><input type="number" id="rmin" value="${S.range.min}"></div>
        <div><label>Maximum</label><input type="number" id="rmax" value="${S.range.max}"></div>
      </div>
    </div>
    <div class="card">
      <h2>Nombres pour × et ÷</h2>
      <div class="rangeGrid">
        <div><label>Minimum</label><input type="number" id="mmin" value="${S.mulRange.min}"></div>
        <div><label>Maximum</label><input type="number" id="mmax" value="${S.mulRange.max}"></div>
      </div>
    </div>
    <div class="card">
      <h2>Paliers de points selon le temps</h2>
      <p class="hint">Réponse donnée en moins de X secondes → Y points. Au-delà du plus grand palier : 0 point.</p>
      <div id="tiers">${ts.map(tierRow).join('')}</div>
      <button class="btn sec" id="addTier">＋ Ajouter un palier</button>
    </div>
  `;
  bindNav();
  el.querySelectorAll('[data-op]').forEach(cb=>cb.onchange=()=>{S.ops[cb.dataset.op]=cb.checked;saveS()});
  $('#rmin').onchange=e=>{S.range.min=parseInt(e.target.value,10)||0;saveS()};
  $('#rmax').onchange=e=>{S.range.max=parseInt(e.target.value,10)||0;saveS()};
  $('#mmin').onchange=e=>{S.mulRange.min=parseInt(e.target.value,10)||0;saveS()};
  $('#mmax').onchange=e=>{S.mulRange.max=parseInt(e.target.value,10)||0;saveS()};
  el.querySelectorAll('#tiers input').forEach(inp=>inp.onchange=()=>{
    const i=+inp.dataset.i,f=inp.dataset.f;
    ts[i][f]=parseFloat(inp.value)||0;
    S.tiers=ts;saveS();renderSettings();
  });
  el.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{
    ts.splice(+b.dataset.del,1);S.tiers=ts;saveS();renderSettings();
  });
  $('#addTier').onclick=()=>{
    const last=ts.length?ts[ts.length-1].max:2;
    ts.push({max:last+2,points:Math.max(0,(ts.length?ts[ts.length-1].points:1)-1)});
    S.tiers=ts;saveS();renderSettings();
  };
}
function navHtml(){
  return `<nav>
    <button class="${view==='play'?'on':''}" data-v="play">Jouer</button>
    <button class="${view==='settings'?'on':''}" data-v="settings">Réglages</button>
  </nav>`;
}
function bindNav(){
  document.querySelectorAll('nav [data-v]').forEach(b=>b.onclick=()=>{
    view=b.dataset.v;
    render();
  });
}
function render(){view==='play'?renderPlay():renderSettings()}
render();
if('serviceWorker' in navigator && /^https?:/.test(location.protocol)){
  navigator.serviceWorker.register('sw.js').catch(()=>{});
}

</script>
</body>
</html>
